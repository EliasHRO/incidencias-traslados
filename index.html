<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Incidencias · Traslados VIDRI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --red:#E31E32;
    --red-dark:#B7132A;
    --navy:#1B2A4A;
    --navy-2:#2C3E63;
    --bg:#EEF1F6;
    --card:#FFFFFF;
    --orange:#F5A623;
    --border:#E3E7EF;
    --muted:#78849A;
    --text:#1B2A4A;
    --green:#1D9A6C;
    --green-bg:#E7F7F0;
    --red-bg:#FDEBEC;
    --amber-bg:#FFF6E5;
    --amber:#B8790A;
    --radius:14px;
    --shadow:0 1px 2px rgba(27,42,74,.04), 0 8px 24px -12px rgba(27,42,74,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:transparent;}
  #app{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  #app.hidden{display:none;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CFDC;border-radius:8px;}

  /* LOGIN */
  #loginScreen{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);border-radius:16px;border:1px solid var(--border);padding:20px;
  }
  #loginScreen.hidden{display:none;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;}
  .login-brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:24px;color:var(--red);text-align:center;margin-bottom:2px;}
  .login-brand img{height:42px;display:block;margin:0 auto;}
  .brand-logo{height:26px;display:block;}
  .login-brand span{color:var(--navy);}
  .login-sub{text-align:center;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:26px;}
  .role-options{display:flex;gap:8px;margin-bottom:16px;}
  .role-opt{
    flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;
    font-size:11.5px;font-weight:700;color:var(--navy-2);cursor:pointer;transition:.15s;background:#fff;
  }
  .role-opt:hover{background:#F5F7FA;}
  .role-opt.active{border-color:var(--red);background:var(--red-bg);color:var(--red-dark);}
  .login-error{color:var(--red-dark);font-size:12px;font-weight:600;margin-top:10px;min-height:16px;}
  .role-badge{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:20px;background:#EEF0F5;color:var(--navy-2);text-transform:uppercase;letter-spacing:.3px;
  }
  .role-badge.owner{background:var(--red-bg);color:var(--red-dark);}
  .role-badge.admin{background:var(--amber-bg);color:var(--amber);}
  .role-badge.operador{background:var(--green-bg);color:var(--green);}
  .role-badge.viewer{background:#EEF0F5;color:var(--navy-2);}
  .logout-link{font-size:11px;color:var(--muted);cursor:pointer;font-weight:700;text-decoration:underline;}
  .logout-link:hover{color:var(--red);}

  /* SIDEBAR */
  .sidebar{
    width:220px;
    min-width:220px;
    background:var(--card);
    border-right:1px solid var(--border);
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .brand{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--red);
    letter-spacing:.5px;
    padding:0 8px 2px;
  }
  .brand span{color:var(--navy);}
  .brand-sub{
    font-size:11px;
    color:var(--muted);
    padding:0 8px 20px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.6px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    color:var(--navy-2);
    cursor:pointer;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75;}
  .nav-item:hover{background:#F3F5F9;}
  .nav-item.active{background:var(--red);color:#fff;}
  .nav-item.active svg{opacity:1;filter:brightness(0) invert(1);}
  .nav-foot{
    margin-top:auto;
    font-size:10.5px;
    color:#A9B2C3;
    padding:10px 8px 0;
    border-top:1px solid var(--border);
  }

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;max-height:92vh;}
  .topbar{
    padding:20px 28px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .page-title{font-size:23px;font-weight:800;margin:0;color:var(--navy);}
  .page-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500;}
  .content{padding:4px 28px 28px;overflow-y:auto;flex:1;}

  .btn{
    border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:13px;
    cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .15s, transform .1s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-red:hover{filter:brightness(1.08);}
  .btn-outline{background:#fff;color:var(--navy-2);border:1px solid var(--border);}
  .btn-outline:hover{background:#F5F7FA;}
  .btn-ghost{background:transparent;color:var(--muted);padding:6px 10px;}
  .btn-ghost:hover{color:var(--red);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* CARDS */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:20px 22px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  @media (max-width:1000px){.grid-kpi{grid-template-columns:repeat(2,1fr);}}
  .kpi{padding:17px 18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .kpi-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .kpi-value{font-size:26px;font-weight:800;color:var(--navy);margin-top:6px;}
  .kpi-note{font-size:11.5px;margin-top:5px;font-weight:600;}
  .kpi-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:900px){.row2{grid-template-columns:1fr;}}
  .card-title{font-size:14.5px;font-weight:700;color:var(--navy);margin:0 0 2px;}
  .card-desc{font-size:11.5px;color:var(--muted);margin:0 0 14px;font-weight:500;}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:700;color:var(--navy-2);}
  .field input, .field select, .field textarea{
    border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13.5px;
    font-family:inherit;color:var(--text);background:#FBFCFD;outline:none;transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--red);background:#fff;}
  .field.full{grid-column:1/-1;}
  .helper{font-size:11px;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-doc{background:var(--red-bg);color:var(--red-dark);}
  .badge-prod{background:var(--amber-bg);color:var(--amber);}
  .badge-otro{background:#EEF0F5;color:var(--navy-2);}
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;
    border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;transform:translateY(8px);transition:opacity .25s, transform .25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid #F0F2F6;color:var(--navy-2);}
  tbody tr:hover{background:#FAFBFD;}
  .table-wrap{max-height:480px;overflow:auto;border:1px solid var(--border);border-radius:12px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
  .filters .field{min-width:150px;}
  .del-btn{background:none;border:none;cursor:pointer;color:#C6CCDA;font-size:14px;}
  .del-btn:hover{color:var(--red);}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-label{width:120px;font-size:12px;font-weight:700;color:var(--navy-2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:#F0F2F7;border-radius:6px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-val{width:34px;text-align:right;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px;margin-right:16px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--red);border-color:var(--red);}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1px solid var(--border);background:#fff;color:var(--navy-2);font-family:inherit;
    font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.15s;
  }
  .pill:hover{background:#F5F7FA;}
  .pill.active{background:var(--red);border-color:var(--red);color:#fff;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(27,42,74,.45);
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}

  textarea.report-box{width:100%;min-height:170px;font-family:'Inter',monospace;font-size:12px;line-height:1.55;padding:14px;border-radius:10px;border:1px solid var(--border);background:#FBFCFD;color:var(--navy-2);resize:vertical;}
  .loading{padding:60px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>

      <div class="field" style="margin-bottom:14px;">
        <label>Usuario</label>
        <input type="text" id="loginUsername" placeholder="Ingrese usuario" autocomplete="off" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" autocomplete="off" required>
      </div>

function drawPdfHeader(doc, title, subtitle){

function chartToImage(config, width, height){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    const chart = new Chart(ctx, {
      ...config,
      options: { ...(config.options||{}), responsive:false, animation:false, devicePixelRatio:1 }
    });
    const img = chart.toBase64Image('image/png', 1.0);
    chart.destroy();
    return img;
  }catch(e){
    console.error('Error generando imagen de gráfica para PDF', e);
    return null;
  }
}

function buildPdfSummaryPage(doc, rows, meta){
  const pageWidth = doc.internal.pageSize.getWidth();
  const total = rows.length;
  const docCount = rows.filter(r=>motivoCat(r.motivo)==='doc').length;
  const prodCount = rows.filter(r=>motivoCat(r.motivo)==='prod').length;
  const otroCount = total - docCount - prodCount;

  const contentY = drawPdfHeader(doc, meta.titulo || 'Reporte de Incidencias', `Resumen · Periodo: ${meta.periodo || ''}`);

  // KPIs
  const kpis = [
    { label:'Total Incidencias', value:String(total), color:[27,42,74] },
    { label:'Sin Documento', value:String(docCount), color:[227,30,50] },
    { label:'Sin Producto', value:String(prodCount), color:[245,166,35] },
    { label:'Otros Motivos', value:String(otroCount), color:[139,150,172] },
  ];
  const kpiW = (pageWidth-80-3*14)/4;
  const kpiY = contentY;
  kpis.forEach((k,i)=>{
    const x = 40 + i*(kpiW+14);
    doc.setFillColor(248,249,251);
    doc.setDrawColor(226,230,239);
    doc.setLineWidth(0.7);
    doc.roundedRect(x, kpiY, kpiW, 58, 6, 6, 'FD');
    doc.setDrawColor(k.color[0],k.color[1],k.color[2]);
    doc.setLineWidth(2.4);
    doc.line(x+3, kpiY+8, x+3, kpiY+50);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(120,132,154);
    doc.text(k.label.toUpperCase(), x+14, kpiY+20);
    doc.setFontSize(19);
    doc.setTextColor(k.color[0],k.color[1],k.color[2]);
    doc.text(k.value, x+14, kpiY+45);
    doc.setFont('helvetica','normal');
  });

  // Tendencia por motivo (agrupado por día si el rango es corto, si no por mes)
  const dates = rows.map(r=>r.fecha).filter(Boolean).sort();
  let byDay = false;
  if(dates.length){
    const span = (new Date(dates[dates.length-1]) - new Date(dates[0])) / 86400000;
    if(span <= 31) byDay = true;
  }
  const keyFn = byDay ? (r=>r.fecha) : (r=>monthKey(r.fecha));
  const labelFn = byDay
    ? (k => fmtDate(k))
    : (k => { const [y,mo]=k.split('-'); return new Date(y,mo-1).toLocaleDateString('es-SV',{month:'short',year:'2-digit'}); });
  const keys = [...new Set(rows.map(keyFn))].filter(Boolean).sort();
  const docSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='doc').length);
  const prodSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='prod').length);
  const otroSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='otro').length);

  const trendImg = chartToImage({
    type:'bar',
    data:{
      labels: keys.map(labelFn),
      datasets:[
        {label:'Sin Documento', data:docSeries, backgroundColor:'#E31E32', borderRadius:3, stack:'s'},
        {label:'Sin Producto', data:prodSeries, backgroundColor:'#F5A623', borderRadius:3, stack:'s'},
        {label:'Otros', data:otroSeries, backgroundColor:'#8B96AC', borderRadius:3, stack:'s'},
      ]
    },
    options:{
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } },
      scales:{ x:{ stacked:true, grid:{display:false} }, y:{ stacked:true, beginAtZero:true, ticks:{precision:0} } }
    }
  }, 900, 480);

  const donutImg = chartToImage({
    type:'doughnut',
    data:{
      labels:['Sin Documento','Sin Producto','Otros'],
      datasets:[{ data:[docCount,prodCount,otroCount], backgroundColor:['#E31E32','#F5A623','#8B96AC'], borderWidth:0 }]
    },
    options:{ cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } } }
  }, 560, 480);

  const chartsY = kpiY + 58 + 42;
  const chartsH = 220;
  const trendW = pageWidth - 80 - 260;
  const donutW = 240;

  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.setTextColor(27,42,74);
  doc.text('Tendencia por motivo', 40, chartsY-16);
  doc.text('Distribución por motivo', 40+trendW+20, chartsY-16);

  if(trendImg){
    doc.addImage(trendImg, 'PNG', 40, chartsY, trendW, chartsH);
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(160,168,184);
    doc.text('No se pudo generar esta gráfica', 40, chartsY+20);
  }
  if(donutImg){
    doc.addImage(donutImg, 'PNG', 40+trendW+20, chartsY, donutW, chartsH);
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(160,168,184);
    doc.text('No se pudo generar esta gráfica', 40+trendW+20, chartsY+20);
  }
}

function generateReportPdf(rows, meta){
  if(typeof window.jspdf === 'undefined'){
    showToast('⚠ No se pudo cargar el generador de PDF. Verifica tu conexión e intenta de nuevo.');
    return;
  }
  if(!rows || !rows.length){
    showToast('⚠ No hay incidencias en este periodo para exportar');
    return;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    if(typeof doc.autoTable !== 'function'){
      showToast('⚠ No se pudo cargar el generador de tablas PDF. Verifica tu conexión e intenta de nuevo.');
      return;
    }
    const pageWidth = doc.internal.pageSize.getWidth();

    // Página 1: resumen y gráficas (ya filtradas a la sucursal/periodo del reporte)
    buildPdfSummaryPage(doc, rows, meta);

    // Página 2: detalle completo de incidencias
    doc.addPage();
    const headerTitle = meta.titulo || 'Reporte de Incidencias';
    const headerSubtitle = `Detalle de incidencias · Periodo: ${meta.periodo || ''} · Total: ${rows.length}`;
    const PDF_HEADER_HEIGHT = 100;

    const sorted = rows.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  const head = [['Fecha','Sucursal','Referencia','Motivo','Notas']];
  const body = sorted.map(r=>[
    fmtDate(r.fecha),
    r.sucursal,
    r.referencia || '—',
    r.motivo,
    r.notas || ''
  ]);

  doc.autoTable({
    head, body,
    margin:{ left:40, right:40, top:PDF_HEADER_HEIGHT, bottom:50 },
    styles:{ fontSize:8.5, cellPadding:5, textColor:[44,62,99] },
    headStyles:{ fillColor:[227,30,50], textColor:255, fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[248,249,251] },
    columnStyles:{
      0:{ cellWidth:65 },
      1:{ cellWidth:100 },
      2:{ cellWidth:80 },
      3:{ cellWidth:140 },
    },
    didDrawPage: ()=>{
      drawPdfHeader(doc, headerTitle, headerSubtitle);
    },
  });

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    drawPdfFooter(doc, i, pageCount);
  }

  const fileSafe = (meta.titulo||'reporte').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  doc.save(`${fileSafe}.pdf`);
  showToast('✓ PDF descargado — adjúntalo en el correo');
  }catch(e){
    console.error('Error generando el PDF', e);
    showToast('⚠ Ocurrió un error generando el PDF. Intenta de nuevo.');
  }
}
function fmtDate(d){
  try{ const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString('es-SV',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; }
}
function monthKey(d){ return (d||"").slice(0,7); }

function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const t = setTimeout(()=> reject(new Error('storage timeout')), ms);
    Promise.resolve(promise).then(v=>{ clearTimeout(t); resolve(v); }, err=>{ clearTimeout(t); reject(err); });
  });
}
const LS_PREFIX = 'vidri_ct_';
const KV_API = '/api/kv';
function hasWindowStorage(){
  try{ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
  catch(e){ return false; }
}
// Capa de almacenamiento en 3 niveles:
// 1) Backend compartido (Cloudflare KV vía /api/kv) — todos los usuarios ven los mismos datos.
//    Si el backend responde, se usa como fuente de verdad (aunque diga que la llave no existe).
// 2) window.storage — solo disponible dentro del visor de Claude (no compartido entre personas).
// 3) localStorage del navegador — último respaldo, solo para ese navegador (no compartido).
async function storageGetRaw(key){
  try{
    const res = await withTimeout(fetch(`${KV_API}?key=${encodeURIComponent(key)}`, { method:'GET' }), 5000);
    if(res && res.ok){
      const data = await res.json();
      return (data && data.value != null) ? data.value : null;
    }
  }catch(e){ /* backend compartido no disponible en este entorno, seguimos con respaldos locales */ }

  if(hasWindowStorage()){
    try{
      const res = await withTimeout(window.storage.get(key, false), 4000);
      if(res && res.value != null) return res.value;
    }catch(e){ /* cae a localStorage */ }
  }
  try{
    const v = localStorage.getItem(LS_PREFIX+key);
    if(v != null) return v;
  }catch(e){ /* localStorage no disponible */ }
  return null;
}
async function storageSetRaw(key, value){
  try{
    const res = await withTimeout(fetch(KV_API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ key, value }),
    }), 5000);
    if(res && res.ok){
      try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){ /* caché local opcional */ }
      return true;
    }
  }catch(e){ /* backend compartido no disponible en este entorno, seguimos con respaldos locales */ }

  let ok = false;
  if(hasWindowStorage()){
    try{
      await withTimeout(window.storage.set(key, value, false), 4000);
      ok = true;
    }catch(e){ console.error('window.storage falló, usando localStorage', e); }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, value);
    ok = true;
  }catch(e){ console.error('localStorage no disponible', e); }
  return ok;
}

  const u = (username||'').trim();
  if(u.toLowerCase() === OWNER_USER.username.toLowerCase() && password === OWNER_PASSWORD){
    return { username: OWNER_USER.username, role: 'owner' };
  }
  const match = USERS.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === password);
  return match ? { username: match.username, role: match.role } : null;
}

  currentRole = role;
  currentUsername = username;
  document.getElementById('loginScreen').classList.add('hidden');

});

  document.getElementById('changePasswordOverlay').classList.remove('show');
});

document.getElementById('formChangePassword').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const p1 = (fd.get('newPassword')||'').trim();
  const p2 = (fd.get('confirmPassword')||'').trim();
  const errEl = document.getElementById('changePasswordError');
  if(!p1 || !p2){ errEl.textContent = 'Completa ambos campos.'; return; }
  if(p1 !== p2){ errEl.textContent = 'Las contraseñas no coinciden.'; return; }
  if(p1.length < 4){ errEl.textContent = 'Usa al menos 4 caracteres.'; return; }

  if(currentRole === 'owner'){
    OWNER_PASSWORD = p1;
    await saveOwnerPassword();
  } else {
    const u = USERS.find(x => x.username.toLowerCase() === (currentUsername||'').toLowerCase());
    if(!u){ errEl.textContent = 'No se encontró tu usuario.'; return; }
    u.password = p1;
    await saveUsers();
  }
  document.getElementById('changePasswordOverlay').classList.remove('show');
  showToast('✓ Contraseña actualizada');
});

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card card-pad" style="margin-bottom:16px;">
      <p class="card-title" style="margin-bottom:8px;">Periodo</p>
      <div class="pill-row" id="dQuick">
        <button class="pill" data-range="today">Hoy</button>
        <button class="pill" data-range="yesterday">Ayer</button>
        <button class="pill" data-range="week">Esta semana</button>
        <button class="pill" data-range="month">Este mes</button>
        <button class="pill" data-range="all">Histórico completo</button>
        <button class="pill" data-range="custom">Fechas personalizadas</button>
      </div>
      <div class="filters" style="margin-top:14px;">
        <div class="field"><label>Desde</label><input type="date" id="dFrom"></div>
        <div class="field"><label>Hasta</label><input type="date" id="dTo"></div>
        <button class="btn btn-outline" id="dClear">Limpiar filtros</button>
      </div>
    </div>

    <div class="grid-kpi" id="dashKpis"></div>

    <div class="row2">
      <div class="card card-pad">
        <p class="card-title">Tendencia por motivo</p>
        <p class="card-desc" id="dashTrendDesc">Incidencias registradas mes a mes</p>
        <canvas id="chartTrend" height="230"></canvas>
      </div>
      <div class="card card-pad">
        <p class="card-title">Distribución por motivo</p>
        <p class="card-desc">Participación de cada causa</p>
        <canvas id="chartDonut" height="230"></canvas>
      </div>
    </div>

    <div class="card card-pad">
      <p class="card-title">Top sucursales con más incidencias</p>
      <p class="card-desc">Ranking del periodo seleccionado — enfoca acciones correctivas aquí primero</p>
      <div id="topSucList"></div>
    </div>
  `;

  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function markCustom(){
    document.querySelectorAll('#dQuick .pill').forEach(p=>p.classList.toggle('active', p.dataset.range==='custom'));
  }
  function getRange(){
    return { from: document.getElementById('dFrom').value, to: document.getElementById('dTo').value };
  }
  function filteredData(){
    const {from,to} = getRange();
    return DATA.filter(r=>{
      if(from && r.fecha < from) return false;
      if(to && r.fecha > to) return false;
      return true;
    });
  }

  function build(){
    const rows = filteredData();
    const total = rows.length;
    const doc = rows.filter(r=>motivoCat(r.motivo)==='doc').length;
    const prod = rows.filter(r=>motivoCat(r.motivo)==='prod').length;
    const otro = total - doc - prod;

    const bySuc = {};
    rows.forEach(r=>{ bySuc[r.sucursal] = (bySuc[r.sucursal]||0)+1; });
    const topSuc = Object.entries(bySuc).sort((a,b)=>b[1]-a[1])[0] || ["—",0];

    document.getElementById('dashKpis').innerHTML = `
      <div class="kpi"><div class="kpi-bar" style="background:var(--navy)"></div>
        <div class="kpi-label">Total Incidencias</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-note" style="color:var(--muted)">En el periodo seleccionado</div>
      </div>
      <div class="kpi"><div class="kpi-bar" style="background:${COLORS.doc}"></div>
        <div class="kpi-label">Sin Documento</div>
        <div class="kpi-value">${doc}</div>
        <div class="kpi-note" style="color:${COLORS.doc}">${total?((doc/total*100).toFixed(0)):0}% del total</div>
      </div>
      <div class="kpi"><div class="kpi-bar" style="background:${COLORS.prod}"></div>
        <div class="kpi-label">Sin Producto</div>
        <div class="kpi-value">${prod}</div>
        <div class="kpi-note" style="color:${COLORS.prod}">${total?((prod/total*100).toFixed(0)):0}% del total</div>
      </div>
      <div class="kpi"><div class="kpi-bar" style="background:var(--red)"></div>
        <div class="kpi-label">Sucursal Crítica</div>
        <div class="kpi-value" style="font-size:19px">${topSuc[0]}</div>
        <div class="kpi-note" style="color:var(--red)">${topSuc[1]} incidencias</div>
      </div>
    `;

    // tendencia: por día si el rango es corto (≤31 días con from/to), si no por mes
    const {from,to} = getRange();
    let byDay = false;
    if(from && to){
      const days = (new Date(to) - new Date(from)) / 86400000;
      if(days <= 31) byDay = true;
    }
    let keys, labelFn;
    if(byDay){
      keys = [...new Set(rows.map(r=>r.fecha))].filter(Boolean).sort();
      labelFn = k => fmtDate(k);
      setTxt2('dashTrendDesc', 'Incidencias registradas por día');
    } else {
      keys = [...new Set(rows.map(r=>monthKey(r.fecha)))].filter(Boolean).sort();
      labelFn = k => { const [y,mo]=k.split('-'); return new Date(y,mo-1).toLocaleDateString('es-SV',{month:'short',year:'2-digit'}); };
      setTxt2('dashTrendDesc', 'Incidencias registradas mes a mes');
    }
    const keyFn = byDay ? (r=>r.fecha) : (r=>monthKey(r.fecha));
    const docSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='doc').length);
    const prodSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='prod').length);
    const otroSeries = keys.map(k=>rows.filter(r=>keyFn(r)===k && motivoCat(r.motivo)==='otro').length);

    if(charts.trend) charts.trend.destroy();
    charts.trend = new Chart(document.getElementById('chartTrend'), {
      type:'bar',
      data:{ labels: keys.map(labelFn),
        datasets:[
          {label:'Sin Documento', data:docSeries, backgroundColor:COLORS.doc, borderRadius:4, stack:'s'},
          {label:'Sin Producto', data:prodSeries, backgroundColor:COLORS.prod, borderRadius:4, stack:'s'},
          {label:'Otros', data:otroSeries, backgroundColor:COLORS.otro, borderRadius:4, stack:'s'},
        ]},
      options:{responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}, scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, grid:{color:'#F0F2F7'}}}}
    });

    if(charts.donut) charts.donut.destroy();
    charts.donut = new Chart(document.getElementById('chartDonut'), {
      type:'doughnut',
      data:{ labels:['Sin Documento','Sin Producto','Otros'], datasets:[{data:[doc,prod,otro], backgroundColor:[COLORS.doc,COLORS.prod,COLORS.otro], borderWidth:0}] },
      options:{responsive:true, cutout:'68%', plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}}
    });

    const maxSuc = Math.max(...Object.values(bySuc), 1);
    const top = Object.entries(bySuc).sort((a,b)=>b[1]-a[1]).slice(0,8);
    document.getElementById('topSucList').innerHTML = top.map(([s,c])=>`
      <div class="bar-row">
        <div class="bar-label">${s}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c/maxSuc*100)}%;background:var(--red)"></div></div>
        <div class="bar-val">${c}</div>
      </div>`).join('') || '<div class="empty">Sin datos en este periodo</div>';
  }
  function setTxt2(id, val){ const el=document.getElementById(id); if(el) el.textContent = val; }

  function setActiveRange(type){
    const today = new Date();
    let from='', to='';
    if(type==='today'){ from = to = toISO(today); }
    else if(type==='yesterday'){ const y=new Date(today); y.setDate(y.getDate()-1); from = to = toISO(y); }
    else if(type==='week'){ const d=new Date(today); const dow=(d.getDay()+6)%7; const monday=new Date(d); monday.setDate(d.getDate()-dow); from=toISO(monday); to=toISO(today); }
    else if(type==='month'){ const first=new Date(today.getFullYear(), today.getMonth(), 1); from=toISO(first); to=toISO(today); }
    else if(type==='all'){ from=''; to=''; }
    if(type !== 'custom'){
      document.getElementById('dFrom').value = from;
      document.getElementById('dTo').value = to;
    }
    document.querySelectorAll('#dQuick .pill').forEach(p=>p.classList.toggle('active', p.dataset.range===type));
    build();
  }

  document.querySelectorAll('#dQuick .pill').forEach(p=>{
    p.addEventListener('click', ()=> setActiveRange(p.dataset.range));
  });
  document.getElementById('dFrom').addEventListener('change', ()=>{ markCustom(); build(); });
  document.getElementById('dTo').addEventListener('change', ()=>{ markCustom(); build(); });
  document.getElementById('dClear').addEventListener('click', ()=> setActiveRange('all'));

  setActiveRange('all');
}

/* ================= REGISTRAR ================= */
function customFieldMarkup(f, prefill){
  const name = 'cf_' + f.id;
  const reqAttr = f.required ? 'required' : '';
  const val = prefill!=null ? prefill : '';
  if(f.type === 'short') return `<div class="field"><label>${f.label}${f.required?' *':''}</label><input type="text" name="${name}" value="${val.replace ? val.replace(/"/g,'&quot;') : val}" ${reqAttr}></div>`;
  if(f.type === 'long') return `<div class="field full"><label>${f.label}${f.required?' *':''}</label><textarea name="${name}" rows="2" ${reqAttr}>${val}</textarea></div>`;
  if(f.type === 'number') return `<div class="field"><label>${f.label}${f.required?' *':''}</label><input type="number" name="${name}" value="${val}" ${reqAttr}></div>`;
  if(f.type === 'select'){
    const opts = (f.options||[]).map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('');
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label><select name="${name}" ${reqAttr}><option value="">Selecciona…</option>${opts}</select></div>`;
  }
  return '';
}

  document.getElementById('formResetPassword').addEventListener('submit', async e=>{

    const u = USERS.find(x=>x.id===fd.get('id'));

    const pass = (fd.get('password')||'').trim();

    renderUsersList();
  });

  document.querySelectorAll('#newUserRole .role-opt').forEach(el=>{

    });
  });

  document.getElementById('formNewUser').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const username = (fd.get('username')||'').trim();
    const password = (fd.get('password')||'').trim();
    const roleEl = document.querySelector('#newUserRole .role-opt.active');
    const role = roleEl ? roleEl.dataset.role : 'viewer';
    if(!username || !password){ showToast('⚠ Completa usuario y contraseña'); return; }
    if(username.toLowerCase() === OWNER_USER.username.toLowerCase() || USERS.some(u=>u.username.toLowerCase()===username.toLowerCase())){

      return;
    }
    USERS.push({ id: uid(), username, password, role });
    await saveUsers();
    showToast('✓ Usuario creado');
    e.target.reset();
    renderUsersList();
  });
}

function isToday(ts){
  if(!ts) return false;
  const d = new Date(ts);
  const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function renderRecent(){
  const el = document.getElementById('recentList');
  if(!el) return;
  const recent = DATA.filter(r=>isToday(r.createdAt)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  el.innerHTML = recent.map(r=>`
    <div style="padding:10px 0;border-bottom:1px solid #F0F2F6;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;font-size:12.8px;">${r.sucursal}</span>
        <span class="badge ${motivoBadgeClass(r.motivo)}">${r.motivo}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:3px;">${fmtDate(r.fecha)} · Ref. ${r.referencia||'—'}</div>
    </div>
  `).join('') || '<div class="empty">Aún no se han registrado incidencias hoy</div>';
}

  function getFiltered(){
    const q = document.getElementById('fSearch').value.trim().toLowerCase();
    const suc = document.getElementById('fSuc').value;
    const mot = document.getElementById('fMot').value;
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    return DATA.filter(r=>{
      if(suc && r.sucursal !== suc) return false;
      if(mot && r.motivo !== mot) return false;
      if(from && r.fecha < from) return false;
      if(to && r.fecha > to) return false;
      if(q && !(r.sucursal.toLowerCase().includes(q) || String(r.referencia).toLowerCase().includes(q))) return false;
      return true;
    }).sort((a,b)=> b.fecha.localeCompare(a.fecha));

      const rec = DATA.find(x=>x.id===id);
      if(!rec) return;
      let sucursal = fd.get('sucursal');
      if(sucursal === '__otra__') sucursal = (fd.get('sucursalOtra')||'').trim().toUpperCase();
      let motivo = fd.get('motivo');
      if(motivo === '__otro__') motivo = (fd.get('motivoOtro')||'').trim().toUpperCase();
      if(!sucursal || !motivo){ showToast('⚠ Completa sucursal y motivo'); return; }

      rec.fecha = fd.get('fecha');
      rec.sucursal = sucursal;
      rec.referencia = (fd.get('referencia')||'').trim();
      rec.motivo = motivo;
      rec.notas = (fd.get('notas')||'').trim();
      rec.extra = rec.extra || {};
      CUSTOM_FIELDS.forEach(f=>{ rec.extra[f.id] = (fd.get('cf_'+f.id)||'').toString().trim(); });

      await saveData();
      showToast('✓ Incidencia actualizada');
      closeEdit();
      renderTable();
    });
  }

  ['fSearch','fSuc','fMot','fFrom','fTo'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderTable);
    document.getElementById(id).addEventListener('change', renderTable);
  });
  document.getElementById('btnClearFilters').addEventListener('click', ()=>{
    ['fSearch','fSuc','fMot','fFrom','fTo'].forEach(id=>document.getElementById(id).value='');
    renderTable();
  });
  document.getElementById('btnExportCsv').addEventListener('click', ()=>{
    const rows = getFiltered();
    const header = ['Fecha','Sucursal','Referencia','Motivo','Notas'];
    const csv = [header.join(',')].concat(rows.map(r=>[r.fecha,r.sucursal,r.referencia,r.motivo,(r.notas||'').replace(/,/g,';')].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
    const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'incidencias_traslados.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  renderTable();
}

/* ================= REPORTE POR SUCURSAL ================= */

  const content = document.getElementById('content');
  content.innerHTML = `

      </div>
    </div>

    ${p.canEmail ? `
    <div class="card card-pad">

        <div class="pill-row" id="contactChips">

  `;

  function getRange(){
    return { from: document.getElementById('rFrom').value, to: document.getElementById('rTo').value, suc: document.getElementById('rSuc').value };
  }
  function filteredData(){
    const {from,to,suc} = getRange();
    return DATA.filter(r=>{
      if(from && r.fecha < from) return false;
      if(to && r.fecha > to) return false;
      if(suc && r.sucursal !== suc) return false;
      return true;
    });
  }

  function selectSucursal(suc){
    document.getElementById('rSuc').value = suc;
    build();
    const anchor = document.getElementById('repMailTitle') || document.getElementById('repTableTitle');
    if(anchor) anchor.scrollIntoView({behavior:'smooth', block:'center'});
  }

function setTxt(id, val){ const el=document.getElementById(id); if(el) el.textContent = val; }
function setVal(id, val){ const el=document.getElementById(id); if(el) el.value = val; }

  let lastReportRows = [];
  let lastReportMeta = { titulo:'', periodo:'' };

  function build(){
    const rows = filteredData();
    lastReportRows = rows;
    const {from,to,suc} = getRange();
    const rangeLabel = from && to && from===to ? fmtDate(from) : (from||to) ? `${from?fmtDate(from):'inicio'} — ${to?fmtDate(to):'hoy'}` : 'histórico completo';
    lastReportMeta.periodo = rangeLabel;
    lastReportMeta.titulo = suc ? `Reporte de Incidencias — ${suc}` : 'Reporte de Incidencias — CD NOVEX / VIDRI';

    const agg = {};
    rows.forEach(r=>{
      if(!agg[r.sucursal]) agg[r.sucursal] = {doc:0,prod:0,otro:0};
      agg[r.sucursal][motivoCat(r.motivo)]++;
    });
    const list = Object.entries(agg).map(([s,v])=>({suc:s, ...v, total:v.doc+v.prod+v.otro})).sort((a,b)=>b.total-a.total);

    if(suc){
      // vista detalle de una sola sucursal: listar incidencias individuales
      setTxt('repTableTitle', `Incidencias en ${suc}`);
      setTxt('repTableDesc', `${rows.length} incidencia(s) en el periodo seleccionado`);
      setTxt('repChartTitle', `Motivos en ${suc}`);
      setTxt('repMailTitle', `Enviar reporte a ${suc}`);
      document.getElementById('repThead').innerHTML = `<tr><th>Fecha</th><th>Referencia</th><th>Motivo</th><th>Notas</th></tr>`;
      const sorted = rows.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
      document.getElementById('repBody').innerHTML = sorted.map(r=>`
        <tr>
          <td>${fmtDate(r.fecha)}</td>
          <td>${r.referencia||'—'}</td>
          <td><span class="badge ${motivoBadgeClass(r.motivo)}">${r.motivo}</span></td>
          <td style="color:var(--muted);">${r.notas||''}</td>
        </tr>
      `).join('') || `<tr><td colspan="4"><div class="empty">Esta sucursal no tiene incidencias en el rango</div></td></tr>`;

      const v = agg[suc] || {doc:0,prod:0,otro:0};
      if(charts.rep) charts.rep.destroy();
      charts.rep = new Chart(document.getElementById('chartRep'), {
        type:'doughnut',
        data:{ labels:['Sin Documento','Sin Producto','Otros'], datasets:[{data:[v.doc,v.prod,v.otro], backgroundColor:[COLORS.doc,COLORS.prod,COLORS.otro], borderWidth:0}] },
        options:{responsive:true, cutout:'68%', plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}}
      });

function breakdownLine(v){
  const parts = [];
  if(v.doc)  parts.push(`Sin documento: ${v.doc}`);
  if(v.prod) parts.push(`Sin producto: ${v.prod}`);
  if(v.otro) parts.push(`Otros motivos: ${v.otro}`);
  return parts.join(', ');
}

      const titulo = `REPORTE DE INCIDENCIAS DE TRASLADOS — ${suc}`;
      let resumen = `Resumen para ${suc}:\n  • Total de incidencias: ${rows.length}\n`;
      if(v.doc)  resumen += `  • Sin documento: ${v.doc}\n`;
      if(v.prod) resumen += `  • Sin producto: ${v.prod}\n`;
      if(v.otro) resumen += `  • Otros motivos: ${v.otro}\n`;
      resumen = resumen.replace(/\n$/,'');
      let detalle = `Detalle de incidencias (fecha · referencia · motivo):\n`;
      sorted.forEach(r=>{ detalle += `  - ${fmtDate(r.fecha)} · Ref. ${r.referencia||'—'} · ${r.motivo}${r.notas? ' · '+r.notas:''}\n`; });
      detalle = detalle.replace(/\n$/,'');
      const cierre = (EMAIL_SETTINGS.closing||EMAIL_DEFAULTS.closing).split('{sucursal}').join('la sucursal '+suc);
      const firma = EMAIL_SETTINGS.signature||EMAIL_DEFAULTS.signature;
      const txt = fillTemplate(EMAIL_SETTINGS.template||EMAIL_DEFAULTS.template, {
        titulo, periodo: rangeLabel, resumen, detalle, cierre, firma
      });
      setVal('repText', txt);

    } else {
      // vista general: todas las sucursales
      setTxt('repTableTitle', 'Incidencias por sucursal');
      setTxt('repTableDesc', 'Desglose por motivo — ordenado de mayor a menor');
      setTxt('repChartTitle', 'Top sucursales');
      setTxt('repMailTitle', 'Enviar reporte a los involucrados');
      document.getElementById('repThead').innerHTML = `<tr><th>Sucursal</th><th>Sin Documento</th><th>Sin Producto</th><th>Otros</th><th>Total</th><th></th></tr>`;
      document.getElementById('repBody').innerHTML = list.map(x=>`
        <tr>
          <td style="font-weight:700;">${x.suc}</td>
          <td><span class="badge badge-doc">${x.doc}</span></td>
          <td><span class="badge badge-prod">${x.prod}</span></td>
          <td><span class="badge badge-otro">${x.otro}</span></td>
          <td style="font-weight:800;">${x.total}</td>
          <td><button class="btn-ghost btn-send-suc" data-suc="${x.suc}" title="Reporte solo de esta sucursal">✉</button></td>
        </tr>
      `).join('') || `<tr><td colspan="6"><div class="empty">Sin incidencias en este rango</div></td></tr>`;

      document.querySelectorAll('.btn-send-suc').forEach(b=>{
        b.addEventListener('click', ()=> selectSucursal(b.dataset.suc));
      });

      if(charts.rep) charts.rep.destroy();
      const top = list.slice(0,10);
      charts.rep = new Chart(document.getElementById('chartRep'), {
        type:'bar',
        data:{ labels: top.map(x=>x.suc), datasets:[{label:'Incidencias', data: top.map(x=>x.total), backgroundColor: COLORS.doc, borderRadius:5}] },
        options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#F0F2F7'}}, y:{grid:{display:false}}} }
      });

      const totalDoc = list.reduce((s,x)=>s+x.doc,0);
      const totalProd = list.reduce((s,x)=>s+x.prod,0);
      const totalOtro = list.reduce((s,x)=>s+x.otro,0);
      const totalAll = totalDoc+totalProd+totalOtro;

      const titulo = `REPORTE DE INCIDENCIAS DE TRASLADOS — CD NOVEX / VIDRI`;
      let resumen = `Resumen general:\n  • Total de incidencias: ${totalAll}\n`;
      if(totalDoc)  resumen += `  • Sin documento: ${totalDoc}\n`;
      if(totalProd) resumen += `  • Sin producto: ${totalProd}\n`;
      if(totalOtro) resumen += `  • Otros motivos: ${totalOtro}\n`;
      resumen = resumen.replace(/\n$/,'');
      let detalle = `Detalle por sucursal:\n`;
      list.forEach(x=>{ detalle += `  - ${x.suc}: ${breakdownLine(x)} (Total: ${x.total})\n`; });
      detalle = detalle.replace(/\n$/,'');
      const cierre = (EMAIL_SETTINGS.closing||EMAIL_DEFAULTS.closing).split('{sucursal}').join('cada sucursal');
      const firma = EMAIL_SETTINGS.signature||EMAIL_DEFAULTS.signature;
      const txt = fillTemplate(EMAIL_SETTINGS.template||EMAIL_DEFAULTS.template, {
        titulo, periodo: rangeLabel, resumen, detalle, cierre, firma
      });
      setVal('repText', txt);
    }
  }

  document.querySelectorAll('.pill').forEach(p=>{
    p.addEventListener('click', ()=> setActiveRange(p.dataset.range));
  });
  document.getElementById('rFrom').addEventListener('change', ()=>{ markCustom(); build(); });
  document.getElementById('rTo').addEventListener('change', ()=>{ markCustom(); build(); });
  document.getElementById('rSuc').addEventListener('change', build);
  document.getElementById('rClear').addEventListener('click', ()=>{
    document.getElementById('rSuc').value='';
    setActiveRange('today');
  });
  if(p.canEmail){
    function addEmailsTo(inputId, emailsStr){
      const input = document.getElementById(inputId);
      const list = input.value.split(',').map(s=>s.trim()).filter(Boolean);
      const toAdd = emailsStr.split(',').map(s=>s.trim()).filter(Boolean);
      let addedCount = 0;
      toAdd.forEach(email=>{
        if(!list.some(e=>e.toLowerCase()===email.toLowerCase())){ list.push(email); addedCount++; }
      });
      input.value = list.join(', ');
      showToast(addedCount ? `✓ ${addedCount} correo(s) agregado(s)` : 'Ya estaban agregados');
    }
    document.querySelectorAll('.contact-add-to').forEach(b=>{
      b.addEventListener('click', ()=> addEmailsTo('repEmails', b.dataset.emails));
    });
    document.querySelectorAll('.contact-add-cc').forEach(b=>{
      b.addEventListener('click', ()=> addEmailsTo('repEmailsCc', b.dataset.emails));
    });
    document.getElementById('btnCopy').addEventListener('click', ()=>{
      const ta = document.getElementById('repText');
      ta.select();
      try{ document.execCommand('copy'); showToast('✓ Reporte copiado'); }
      catch(e){ navigator.clipboard?.writeText(ta.value); showToast('✓ Reporte copiado'); }
    });
    document.getElementById('btnMail').addEventListener('click', ()=>{
      const emails = document.getElementById('repEmails').value.trim();
      const cc = document.getElementById('repEmailsCc').value.trim();
      const {suc} = getRange();
      const subject = encodeURIComponent(suc ? `Reporte de Incidencias de Traslados — ${suc}` : 'Reporte de Incidencias de Traslados — CD NOVEX');
      const body = encodeURIComponent(document.getElementById('repText').value);
      let mailto = `mailto:${encodeURIComponent(emails)}?subject=${subject}&body=${body}`;
      if(cc) mailto += `&cc=${encodeURIComponent(cc)}`;
      window.open(mailto, '_blank');
    });
    document.getElementById('btnPdf').addEventListener('click', ()=>{
      generateReportPdf(lastReportRows, lastReportMeta);
    });
  }

  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function markCustom(){
    document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.range==='custom'));
  }
  function setActiveRange(type){
    const today = new Date();
    let from='', to='';
    if(type==='today'){ from = to = toISO(today); }
    else if(type==='yesterday'){ const y=new Date(today); y.setDate(y.getDate()-1); from = to = toISO(y); }
    else if(type==='week'){ const d=new Date(today); const dow=(d.getDay()+6)%7; const monday=new Date(d); monday.setDate(d.getDate()-dow); from=toISO(monday); to=toISO(today); }
    else if(type==='month'){ const first=new Date(today.getFullYear(), today.getMonth(), 1); from=toISO(first); to=toISO(today); }
    else if(type==='all'){ from=''; to=''; }
    // 'custom' leaves current input values untouched
    if(type !== 'custom'){
      document.getElementById('rFrom').value = from;
      document.getElementById('rTo').value = to;
    }
    document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.range===type));
    build();
  }

  // vista primaria: incidencias registradas hoy
  setActiveRange('today');
}
